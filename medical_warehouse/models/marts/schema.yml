version: 2

models:
  - name: dim_channels
    columns:
      - name: channel_key
        tests:
          - unique
          - not_null
      - name: channel_name
        tests:
          - unique
          - not_null

  - name: dim_dates
    columns:
      - name: date_key
        tests:
          - unique
          - not_null

  - name: fct_messages
    columns:
      - name: message_id
        tests:
          - not_null
          # Combined unique test maybe? message_id + channel_key is unique.
          # But for now assuming message_id is unique enough within our scope or testing granularity.
      - name: channel_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_channels')
              field: channel_key
      - name: date_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_dates')
              field: date_key

  - name: fct_image_detections
    description: "Fact table for YOLOv8 object detections in images."
    columns:
      - name: message_id
        tests:
          - not_null
      - name: detected_class
        tests:
          - not_null
      - name: image_category
        tests:
          - not_null
          - accepted_values:
              values: ["promotional", "product_display", "lifestyle", "other"]
